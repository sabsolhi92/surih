<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jom Surih Huruf Rawak</title>
    <!-- Memuat turun font dengan bentuk huruf 'a' bulat -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            /* Menggunakan font dengan bentuk huruf tulisan tangan kanak-kanak */
            font-family: 'Comic Neue', 'Comic Sans MS', cursive;
            margin: 0;
            background-color: #fce4ec; 
            overflow: hidden;
            text-align: center;
        }
        
        #menu {
            margin-top: 20vh;
            background: white;
            display: inline-block;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 8px 15px rgba(0,0,0,0.1);
            border: 4px solid #ff99cc;
        }

        h1 { color: #ff66b2; font-size: 36px; }
        p { font-size: 20px; color: #555; }

        .btn {
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 22px;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            font-family: inherit;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-menu { background-color: #ff99cc; }
        .btn-menu:hover { background-color: #ff66b2; transform: scale(1.05); }

        /* Butang Kembali (Home) */
        #home-btn {
            display: none; /* Disembunyikan pada asalnya */
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background-color: #ffb366;
            padding: 12px 20px;
            font-size: 20px;
        }
        #home-btn:hover { background-color: #ff9933; }

        #gameArea {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: row; 
        }

        .player-screen {
            flex: 1;
            border-right: 4px dashed #ff99cc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #fff0f5;
        }
        .player-screen:last-child { border-right: none; }

        .player-title {
            position: absolute;
            top: 20px;
            font-size: 28px;
            color: #ff66b2;
            font-weight: bold;
            background: white;
            padding: 5px 20px;
            border-radius: 15px;
            border: 2px solid #ff99cc;
        }

        .canvas-container {
            position: relative;
            width: 300px;
            height: 400px;
            background: white;
            border-radius: 20px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            margin-top: 40px;
            overflow: hidden;
        }

        .letter-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 350px; 
            color: #e0e0e0;
            user-select: none;
            z-index: 1;
            line-height: 1;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            cursor: crosshair;
            border-radius: 20px;
        }

        .controls {
            margin-top: 25px;
            z-index: 3;
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 300px;
        }

        .clear-btn { background: #ff4d4d; flex: 1; padding: 15px 10px; }
        .clear-btn:hover { background: #cc0000; }
        
        .done-btn { background: #00cc66; flex: 1; padding: 15px 10px; }
        .done-btn:hover { background: #00994d; }

        /* Gaya untuk animasi pujian */
        .bagus-msg {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            color: #ffaa00;
            font-weight: bold;
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
            z-index: 10;
            pointer-events: none;
            animation: popUp 1s ease-out forwards;
        }

        @keyframes popUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <button id="home-btn" class="btn" onclick="goHome()">🏠 Tamat / Kembali</button>

    <div id="menu">
        <h1>🌟 Jom Surih! Dunia Huruf 🌟</h1>
        <p>Pilih jumlah pemain untuk bermula:</p>
        <button class="btn btn-menu" onclick="startGame(1)">1 Pemain 🙋</button>
        <button class="btn btn-menu" onclick="startGame(2)">2 Pemain 🙋‍♂️🙋</button>
        <button class="btn btn-menu" onclick="startGame(3)">3 Pemain 🙋‍♂️🙋🙋‍♂️</button>
    </div>

    <div id="gameArea"></div>

    <script>
        const letters = ['a', 'b', 'c', 'd', 'e', 'f'];

        // Fungsi untuk mendapatkan huruf rawak permulaan
        function getRandomLetter() {
            return letters[Math.floor(Math.random() * letters.length)];
        }

        function startGame(playerCount) {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('home-btn').style.display = 'block'; // Paparkan butang kembali
            const gameArea = document.getElementById('gameArea');
            gameArea.style.display = 'flex';
            gameArea.innerHTML = '';

            for (let i = 1; i <= playerCount; i++) {
                let initialLetter = getRandomLetter();
                gameArea.innerHTML += `
                    <div class="player-screen">
                        <div class="player-title">Pemain ${i}</div>
                        <div class="canvas-container" id="container-${i}">
                            <div class="letter-bg" id="bg-letter-${i}">${initialLetter}</div>
                            <canvas id="canvas-${i}" width="300" height="400"></canvas>
                        </div>
                        <div class="controls">
                            <button class="btn clear-btn" onclick="clearCanvas(${i})">Padam 🧹</button>
                            <button class="btn done-btn" onclick="nextRandomLetter(${i})">Siap ✅</button>
                        </div>
                    </div>
                `;
            }

            setTimeout(() => {
                for (let i = 1; i <= playerCount; i++) {
                    initCanvas(`canvas-${i}`);
                }
            }, 100);
        }

        // Fungsi untuk kembali ke menu utama
        function goHome() {
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('gameArea').innerHTML = ''; // Kosongkan pemain semasa
            document.getElementById('menu').style.display = 'inline-block';
            document.getElementById('home-btn').style.display = 'none'; // Sembunyikan semula butang
        }

        // Fungsi apabila butang Siap ditekan
        function nextRandomLetter(player) {
            // Tunjuk animasi pujian
            showGreatJob(player);

            const currentLetter = document.getElementById(`bg-letter-${player}`).innerText;
            
            // Tapis huruf semasa supaya tidak dapat huruf yang sama dua kali berturut-turut
            let availableLetters = letters.filter(l => l !== currentLetter);
            let randomLetter = availableLetters[Math.floor(Math.random() * availableLetters.length)];
            
            // Tukar huruf selepas animasi berjalan sedikit (setengah saat)
            setTimeout(() => {
                document.getElementById(`bg-letter-${player}`).innerText = randomLetter;
                clearCanvas(player);
            }, 600);
        }

        // Fungsi memaparkan teks pujian
        function showGreatJob(player) {
            const container = document.getElementById(`container-${player}`);
            const msg = document.createElement('div');
            msg.innerText = 'Bagus! 🌟';
            msg.className = 'bagus-msg';
            container.appendChild(msg);
            
            // Buang elemen selepas animasi tamat (1 saat)
            setTimeout(() => msg.remove(), 1000);
        }

        function clearCanvas(player) {
            const canvas = document.getElementById(`canvas-${player}`);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function initCanvas(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            let isDrawing = false;

            ctx.lineWidth = 25;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#33b5e5'; 

            const startPosition = (e) => {
                isDrawing = true;
                draw(e);
            };

            const endPosition = () => {
                isDrawing = false;
                ctx.beginPath();
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault(); 
                
                let clientX = e.clientX || e.touches[0].clientX;
                let clientY = e.clientY || e.touches[0].clientY;
                
                const rect = canvas.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            canvas.addEventListener('mousedown', startPosition);
            canvas.addEventListener('mouseup', endPosition);
            canvas.addEventListener('mousemove', draw);
            
            canvas.addEventListener('touchstart', startPosition, {passive: false});
            canvas.addEventListener('touchend', endPosition);
            canvas.addEventListener('touchmove', draw, {passive: false});
        }
    </script>
</body>
</html>
